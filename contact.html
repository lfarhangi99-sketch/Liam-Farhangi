<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Liam O. Farhangi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="wrap">
    <div class="nav-mark"><b>L.O.F</b> // MECH-E</div>
    <ul class="nav-links">
      <li><a href="index.html">About</a></li>
      <li><a href="experience.html">Experience</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="skills.html">Skills</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </div>
</nav>

<main>
  <div class="wrap">
    <div class="sheet-label"><span class="num">SHEET 6</span> CONTACT <span class="rule"></span></div>
    <h2 class="head">Let's talk about the next project</h2>
    <p class="lede" data-bind="contact.lede"></p>

    <div class="contact-block">
      <div class="contact-cell">
        <span class="k">Email</span>
        <a class="v" data-bind="contact.email" data-href="contact.email" href="#"></a>
      </div>
      <div class="contact-cell">
        <span class="k">Phone</span>
        <a class="v" data-bind="contact.phone" data-href="contact.phone" href="#"></a>
      </div>
      <div class="contact-cell">
        <span class="k">LinkedIn</span>
        <a class="v" data-bind="contact.linkedinLabel" data-href="contact.linkedin" href="#" target="_blank" rel="noopener"></a>
      </div>
      <div class="contact-cell">
        <span class="k">Location</span>
        <span class="v" data-bind="contact.location"></span>
      </div>
    </div>

    <div class="hero-cta" style="margin-top:24px;">
      <a class="btn primary" data-resume href="#" download style="display:none;">Download Resume</a>
    </div>
  </div>
</main>

<footer>LIAM O. FARHANGI &mdash; MECHANICAL ENGINEERING &mdash; REV. 2026</footer>
